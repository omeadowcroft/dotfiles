# Fallout terminal theme (matches hyprlauncher / hyprtoolkit)
font_family      Fixedsys Excelsior
bold_font        auto
italic_font      auto
font_size        17
disable_ligatures always

background       #07130b
foreground       #67d97a
cursor           #67d97a
cursor_text_color #07130b
cursor_shape     block
cursor_blink_interval 0.53
selection_background #67d97a
selection_foreground #07130b
url_color        #9dffae
window_padding_width 12

color0  #0f2a18
color8  #2f8a45
color1  #e0a33a
color9  #ffc857
color2  #4fb866
color10 #9dffae
color3  #b8d967
color11 #d9d967
color4  #2f8a45
color12 #58c46c
color5  #3fa656
color13 #7ee893
color6  #58c46c
color14 #8cdb92
color7  #67d97a
color15 #c8ffd2
