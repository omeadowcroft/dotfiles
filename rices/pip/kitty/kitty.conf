# Font
font_family      JetBrains Mono
font_size        16.0

# Colors / theme
background       #1e1e2e
foreground       #cdd6f4

# Transparency
background_opacity 1.0

# Window padding
window_padding_width 8

# Tab bar style
tab_bar_style    powerline

# Cursor shape
cursor_shape     beam

# Scrollback lines
scrollback_lines 10000
